<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React Agent</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      display: flex;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    .container {
      display: flex;
      width: 100%;
      height: 100%;
    }
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #333;
      max-width: 50%;
    }
    .chat-header {
      padding: 16px;
      background: #16213e;
      border-bottom: 1px solid #333;
    }
    .chat-header h1 {
      font-size: 18px;
      color: #00d4ff;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .message {
      margin-bottom: 16px;
      padding: 12px;
      border-radius: 8px;
    }
    .message.user {
      background: #0f3460;
      margin-left: 20%;
    }
    .message.assistant {
      background: #1f4068;
      margin-right: 20%;
    }
    .message-label {
      font-size: 12px;
      color: #888;
      margin-bottom: 4px;
    }
    .message-content {
      word-break: break-word;
    }
    .input-area {
      padding: 16px;
      background: #16213e;
      display: flex;
      gap: 8px;
    }
    .input-area input {
      flex: 1;
      padding: 12px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #1a1a2e;
      color: #e0e0e0;
      font-size: 14px;
    }
    .input-area input:focus {
      outline: none;
      border-color: #00d4ff;
    }
    .input-area button {
      padding: 12px 24px;
      background: #00d4ff;
      color: #1a1a2e;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .input-area button:disabled {
      background: #555;
      cursor: not-allowed;
    }
    .trace-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0f0f1a;
    }
    .trace-header {
      padding: 16px;
      background: #16213e;
      border-bottom: 1px solid #333;
    }
    .trace-header h2 {
      font-size: 14px;
      color: #ff6b6b;
    }
    .trace-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .trace-step {
      margin-bottom: 16px;
      padding: 12px;
      background: #1a1a2e;
      border-radius: 8px;
      border-left: 3px solid #00d4ff;
    }
    .trace-step-num {
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
    }
    .trace-item {
      margin: 8px 0;
      font-size: 13px;
    }
    .trace-item-label {
      color: #888;
      margin-right: 8px;
    }
    .trace-item-content {
      color: #e0e0e0;
    }
    .trace-thought { border-left-color: #00d4ff; }
    .trace-action { border-left-color: #ffd93d; }
    .trace-observation { border-left-color: #6bcb77; }
    .trace-error { border-left-color: #ff6b6b; }
    .trace-final { border-left-color: #6bcb77; background: #1a2e1a; }
    .loading {
      text-align: center;
      padding: 20px;
      color: #888;
    }
    .loading::after {
      content: '...';
      animation: dots 1.5s steps(4, end) infinite;
    }
    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="chat-panel">
      <div class="chat-header">
        <h1>🤖 React Agent</h1>
      </div>
      <div class="messages" id="messages"></div>
      <div class="input-area">
        <input type="text" id="input" placeholder="输入你的问题..." autocomplete="off">
        <button id="send">发送</button>
      </div>
    </div>
    <div class="trace-panel">
      <div class="trace-header">
        <h2>📋 Trace</h2>
      </div>
      <div class="trace-content" id="trace"></div>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const traceEl = document.getElementById('trace');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    let isLoading = false;

    function addMessage(role, content) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.innerHTML = `
        <div class="message-label">${role === 'user' ? '你' : 'Agent'}</div>
        <div class="message-content">${escapeHtml(content)}</div>
      `;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function renderTrace(trace, final) {
      if (!trace || trace.length === 0) {
        traceEl.innerHTML = '<div class="loading">等待发送消息...</div>';
        return;
      }

      traceEl.innerHTML = trace.map(step => {
        let html = `<div class="trace-step">`;
        html += `<div class="trace-step-num">Step ${step.step}</div>`;

        if (step.thought) {
          html += `<div class="trace-item">
            <span class="trace-item-label">🤔 Thought:</span>
            <span class="trace-item-content">${escapeHtml(step.thought)}</span>
          </div>`;
        }
        if (step.action) {
          html += `<div class="trace-item">
            <span class="trace-item-label">🔧 Action:</span>
            <span class="trace-item-content">${step.action.tool}(${escapeHtml(step.action.input || '{}')})</span>
          </div>`;
        }
        if (step.observation) {
          html += `<div class="trace-item">
            <span class="trace-item-label">📋 Observation:</span>
            <span class="trace-item-content">${escapeHtml(step.observation.slice(0, 500))}${step.observation.length > 500 ? '...' : ''}</span>
          </div>`;
        }
        if (step.error) {
          html += `<div class="trace-item">
            <span class="trace-item-label">❌ Error:</span>
            <span class="trace-item-content">${escapeHtml(step.error)}</span>
          </div>`;
        }
        if (step.final) {
          html += `<div class="trace-item">
            <span class="trace-item-label">✅ Final:</span>
            <span class="trace-item-content">${escapeHtml(step.final)}</span>
          </div>`;
        }

        html += `</div>`;
        return html;
      }).join('');
    }

    async function send() {
      const message = inputEl.value.trim();
      if (!message || isLoading) return;

      isLoading = true;
      inputEl.value = '';
      sendBtn.disabled = true;

      addMessage('user', message);

      // 显示加载中
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'message assistant';
      loadingDiv.innerHTML = '<div class="loading">Agent 思考中</div>';
      messagesEl.appendChild(loadingDiv);
      messagesEl.scrollTop = messagesEl.scrollHeight;

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });

        const data = await res.json();
        messagesEl.removeChild(loadingDiv);

        if (data.error) {
          addMessage('assistant', `错误: ${data.error}`);
        } else {
          addMessage('assistant', data.final);
          renderTrace(data.trace, data.final);
        }
      } catch (err) {
        messagesEl.removeChild(loadingDiv);
        addMessage('assistant', `请求失败: ${err.message}`);
      } finally {
        isLoading = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    sendBtn.addEventListener('click', send);
    inputEl.addEventListener('keypress', e => {
      if (e.key === 'Enter') send();
    });

    // 初始化
    renderTrace([], '');
  </script>
</body>
</html>
